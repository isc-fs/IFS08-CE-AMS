name: Release AMS firmware

# Triggered when a semver-like tag (v*) is pushed to the repo. The
# canonical workflow is:
#
#   1. Merge dev -> main via PR.
#   2. On the resulting merge commit on main, tag a version:
#        git tag v1.3.0-flatten <merge-sha>
#        git push origin v1.3.0-flatten
#   3. This workflow fires on the tag push:
#        - cross-compiles the firmware
#        - converts .elf -> .bin + .hex
#        - runs the flash-layout guard
#        - reports flash + RAM sizes in the run summary
#        - creates a GitHub Release named after the tag with the
#          three binary assets (AMS.elf / AMS.bin / AMS.hex) attached
#
# Tag-triggered rather than push-to-main-triggered on purpose: dev->main
# merges don't always coincide with a release-worthy SHA (you might
# merge twice in a row before tagging). Decoupling the tag from the
# merge lets the team decide explicitly when to publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write   # required to create the Release + upload assets

# Only one release in flight per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Configure CMake (cross, Release)
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware
        run: cmake --build build -j

      - name: Verify app entry point is 0x08020000
        run: |
          # Two independent checks of the same invariant:
          #   1) scripts/check_flash_layout.py asserts .isr_vector LMA
          #      and that no section spills outside the app region.
          #   2) An explicit objdump grep so the workflow summary is
          #      unambiguous about the entry point (and the run fails
          #      loud if the section ever gets renamed).
          set -e
          python3 scripts/check_flash_layout.py build/AMS.elf | tee layout.log

          ENTRY=$(arm-none-eabi-objdump -h build/AMS.elf \
                  | awk '/\.isr_vector/ {print "0x"$5; exit}')
          echo "Detected .isr_vector LMA: $ENTRY"
          if [ "$ENTRY" != "0x08020000" ]; then
            echo "::error::App entry point is $ENTRY, expected 0x08020000"
            exit 1
          fi

          {
            echo "## App entry point"
            echo "✓ \`.isr_vector\` LMA = \`$ENTRY\` (matches contract \`0x08020000\`)"
            echo
            echo "## Flash layout"
            echo '```'
            cat layout.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Convert .elf to .bin and .hex
        run: |
          arm-none-eabi-objcopy -O binary build/AMS.elf build/AMS.bin
          arm-none-eabi-objcopy -O ihex   build/AMS.elf build/AMS.hex
          ls -la build/AMS.*

      - name: Report sizes
        id: sizes
        run: |
          {
            echo "## Firmware sizes for \`${{ steps.tag.outputs.name }}\`"
            echo '```'
            arm-none-eabi-size --format=berkeley build/AMS.elf
            echo '```'
            echo
            echo '### Asset sizes'
            echo '```'
            ls -la build/AMS.bin build/AMS.elf build/AMS.hex | awk '{printf "%-15s  %s bytes\n", $NF, $5}'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Run host unit tests
        run: |
          cmake -B build-tests -S tests/unit
          cmake --build build-tests -j
          ctest --test-dir build-tests --output-on-failure

      - name: Generate release notes
        id: notes
        run: |
          TAG=${{ steps.tag.outputs.name }}
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "# AMS firmware \`${TAG}\`"
            echo
            echo "Cross-compiled with \`arm-none-eabi-gcc 14.2.Rel1\` against \`STM32H733ZGTx\` for the IFS08-CE accumulator."
            echo
            echo "## Assets"
            echo "- \`AMS.elf\` — debug symbols included"
            echo "- \`AMS.bin\` — raw image, flash to \`0x08020000\` (sector 1)"
            echo "- \`AMS.hex\` — Intel HEX with absolute addressing"
            echo
            echo "## Memory layout"
            echo "- App entry point: \`0x08020000\` (sectors 1-6, 768 KB)"
            echo "- Flashed over CAN."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since \`$PREV\`"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}" | grep -vE '^\- Merge (pull request|branch)' | head -50
              echo
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              echo "## Initial release on this tag namespace"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.name }}
          # Build a sensible release title from the tag. If the tag is
          # `v1.3.0-flatten`, title becomes "v1.3.0 — flatten"; if it's
          # just `v1.3.0`, no suffix.
          if echo "$TAG" | grep -q '-'; then
            BASE=${TAG%%-*}
            SUFFIX=${TAG#*-}
            TITLE="$BASE — $SUFFIX"
          else
            TITLE="$TAG"
          fi

          # If a release already exists for this tag (re-run from
          # workflow_dispatch), delete it first so we can recreate
          # with fresh assets. Idempotent.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Existing release for $TAG found; deleting before recreating."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            build/AMS.elf \
            build/AMS.bin \
            build/AMS.hex
