name: Build and unit tests

# Cross-compiles the firmware to confirm it still links for STM32H733,
# then runs the host-side unit tests in tests/unit/. Triggers on every
# push to feat/** or fix/** and on every PR into dev.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - dev
      - main
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  firmware-build:
    name: Firmware cross-compile (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Configure CMake (cross)
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build firmware
        run: cmake --build build -j

      - name: Report sizes
        run: |
          echo "## Firmware sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          arm-none-eabi-size --format=berkeley build/AMS.elf >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify bootloader-compatible flash layout
        run: |
          python3 scripts/check_flash_layout.py build/AMS.elf | tee layout.log
          {
            echo "## Flash layout vs. stm32-can-bootloader"
            echo '```'
            cat layout.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  unit-tests:
    name: Host unit tests (Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (host)
        run: cmake -B build-tests -S tests/unit

      - name: Build tests
        run: cmake --build build-tests -j

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  dbc-sync:
    name: DBC matches code (dbc_dump)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/dbc/ams.dbc is GENERATED from the code-first descriptors
      # (Core/Inc/can/messages/*.def -> tools/dbc_dump.cpp). This guards
      # that the committed DBC matches the firmware's actual wire layout
      # -- the C++<->DBC drift that the old gen_dbc.py never checked.
      # Regenerate locally with: c++ -std=c++17 -I Core/Inc \
      #   tools/dbc_dump.cpp -o /tmp/dbc_dump && /tmp/dbc_dump > docs/dbc/ams.dbc
      - name: Build dbc_dump and regenerate
        run: |
          c++ -std=c++17 -I Core/Inc tools/dbc_dump.cpp -o /tmp/dbc_dump
          /tmp/dbc_dump > /tmp/ams.dbc
      - name: Verify committed docs/dbc/ams.dbc is up to date
        run: diff -u docs/dbc/ams.dbc /tmp/ams.dbc
