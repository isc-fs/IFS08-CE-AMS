name: Build and unit tests

# Cross-compiles the firmware to confirm it still links for STM32H733,
# then runs the host-side unit tests in tests/unit/. Triggers on every
# push to feat/** or fix/** and on every PR into dev.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - dev
      - main
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  firmware-build:
    name: Firmware cross-compile (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Configure CMake (cross)
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build firmware
        run: cmake --build build -j

      - name: Report sizes
        run: |
          echo "## Firmware sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          arm-none-eabi-size --format=berkeley build/AMS.elf >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  unit-tests:
    name: Host unit tests (Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (host)
        run: cmake -B build-tests -S tests/unit

      - name: Build tests
        run: cmake --build build-tests -j

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure
