# Source of truth for ROADMAP.md.
#
# Edit this file (or close / reopen a tracking issue on GitHub) and the
# `roadmap.yml` workflow will regenerate ROADMAP.md with updated status
# badges and a fresh mermaid branch diagram. Do not hand-edit ROADMAP.md —
# the workflow will overwrite any local changes.

title: AMS roadmap

intro: |
  Refactor roadmap for the IFS08-CE Accumulator Management System (AMS).
  We are porting the legacy bare-metal AMS firmware (originally living in
  `isc-fs/IFS08-CE/AMS`) to a FreeRTOS-based architecture in this dedicated
  repository, targeting the STM32H733ZGTx.

  Each phase is a cluster of feat branches cut from `dev`; a milestone tag
  on `main` closes the phase once every branch in it has merged. Branch
  status badges (✅ / 🔄 / 🔜) are derived from each branch's tracking
  issue state in GitHub Issues.

  **v1.0.0** is tagged at the end of Phase 5 — the AMS is feature-complete
  for vehicle commissioning. **v1.1.0** at the end of Phase 6 makes the
  image bootloader-compatible (lives in flash sectors 1..6 and can be
  flashed in-system via [stm32-can-bootloader](https://github.com/isc-fs/stm32-can-bootloader)).
  Subsequent work (charger profiles, balancing tuning, telemetry over
  CAN-FD) lives outside the v1 scope.

phases:
  - number: 1
    title: Project bootstrap
    tag: v0.1.0-scaffold
    branches:
      - name: feat/2-pm-deliverables
        scope: architecture spec + CAN map + roadmap + PR template
      - name: feat/3-cubemx-freertos
        scope: CubeMX regen with FreeRTOS + C++ build green
      - name: feat/4-dir-layout
        scope: dir layout, ScopedMutex, ams_config.hpp, IWDG init

  - number: 2
    title: Safety supervisor
    tag: v0.2.0-safety
    branches:
      - name: feat/5-relay-driver
        scope: relay_driver + GPIO inactive on boot + backup-reg error latch
      - name: feat/6-safety-task
        scope: SafetyTask skeleton + IWDG feed on clean path only
      - name: feat/7-safety-predicates
        scope: range-check predicates + FORCE_ERROR event flag plumbing

  - number: 3
    title: BMS communications
    tag: v0.3.0-bms
    branches:
      - name: feat/8-bms-service
        scope: BmsService + can_frame.hpp + FDCAN1 ISR -> queue
      - name: feat/9-bms-rx-task
        scope: BmsRxTask parsing 5 modules x 19 cells + 38 temps
      - name: feat/10-bms-poll-task
        scope: BmsPollTask 250 ms V / 500 ms T + freshness watchdog

  - number: 4
    title: Current + accumulator CAN
    tag: v0.4.0-pack-io
    branches:
      - name: feat/11-current-task
        scope: CurrentTask ADC + filter + sensor-stale detection
      - name: feat/12-acu-can-rx
        scope: AcuCanTask RX (DC bus, start button, charger detect)
      - name: feat/13-acu-can-tx
        scope: AcuCanTask TX (pack status @ 100 ms, fault word, min V)

  - number: 5
    title: State machine + integration
    tag: v1.0.0
    branches:
      - name: feat/14-state-task
        scope: StateTask FSM (6 states) + relay request via SafetyTask
      - name: feat/15-precharge-timing
        scope: precharge timing + transition verification + ERROR latch wiring
      - name: feat/16-fan-telemetry
        scope: fan PWM (RUN vs CHARGE duty) + telemetry UART
      - name: feat/17-sil-tests
        scope: SIL harness + integration tests (state transitions, fault injection)
      - name: feat/18-commissioning
        scope: on-vehicle commissioning + calibration constants finalised

  - number: 6
    title: Bootloader integration
    tag: v1.1.0-bootloader
    branches:
      - name: feat/19-flash-relocation
        scope: app at 0x08020000, BKP1R for ErrorLatch, CI flash-layout guard
      - name: feat/20-bootloader-trigger
        scope: CAN-triggered jump to bootloader (FDCAN1 id 0x002 + 4 B magic)

  - number: 7
    title: LTC6811-1 BMS migration
    tag: v1.2.0-ltc6811
    branches:
      - name: feat/67-ltc6811-driver
        scope: PEC15 + LTC6811 register-group encoders/decoders + chain discovery
      - name: feat/68-ltc6820-bus
        scope: LTC6820 isoSPI master wrapper around HAL_SPI + CS pulse train
      - name: feat/69-chain-discovery
        scope: LTC chain wakeup + length discovery on boot
      - name: feat/70-bms-via-ltc6811
        scope: replace BmsService data source with LTC6811-1 register groups
      - name: feat/71-temp-acquisition
        scope: NTC temperature acquisition via ADG731 mux (200 NTCs)
      - name: feat/72-bms-poll-task-rewrite
        scope: rewrite BmsPollTask to drive LTC6811 over isoSPI
      - name: feat/73-retire-bms-rx-task
        scope: retire BmsRxTask + bms_rx_queue, move boot-trigger to FDCAN1
      - name: feat/74-cell-balancing
        scope: passive cell balancing via WRCFGA DCC bits

  - number: 8
    title: Simplification refactor
    tag: v1.3.0-flatten
    branches:
      - name: fix/13-safety-boot-grace
        scope: kSafetyBootGraceMs 2 s gate to stop IWDG reset loop at first iter
      - name: fix/14-iwdg-latch-loop
        scope: refresh watchdog on latched path so chip stays alive for diag
      - name: fix/15-hil-stub-clear-latch
        scope: ErrorLatch::clear() + skip LTC discovery under AMS_BMS_HIL_STUB
      - name: fix/17-hil-stub-pre-scheduler-clear
        scope: pre-scheduler RTC_BKP_DR1 wipe to win the race with SafetyTask
      - name: fix/18-pin-map-schematic
        scope: align pin map with v1.2 daughterboard (PB4-7); retire SDC predicate
      - name: feat/16-bl-jump-reason-node-id
        scope: jump-reason log in BKP2R + node ID in firmware_info.reserved[0]
      - name: refactor/19-services-to-globals
        scope: phase 1+2 - drop service mutexes + relocate HIL_STUB to data source
      - name: refactor/19-phase3-main-task
        scope: phase 3 - collapse SafetyTask + StateTask + TelemetryTask into MainTask
      - name: refactor/19-phase5-current-rename
        scope: phase 5 - rename CurrentTask -> CurrentSensorTask

sidequests:
  - title: Workflow polish
    note: Not part of the AMS refactor roadmap. Kept here for branch history.
    branches:
      - feat/1-autoclose-on-dev-merge
      - fix/1-workflow-titled-branches
